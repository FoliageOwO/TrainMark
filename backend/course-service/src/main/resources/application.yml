server:
  port: 8083
spring:
  application:
    name: course-service
trainmark:
  notification:
    base-url: ${TRAINMARK_NOTIFICATION_BASE_URL:http://localhost:8089}
    event-enabled: ${TRAINMARK_NOTIFICATION_EVENT_ENABLED:true}
  course:
    store: ${TRAINMARK_COURSE_STORE:memory}
    jdbc:
      url: ${TRAINMARK_COURSE_JDBC_URL:}
      username: ${TRAINMARK_COURSE_JDBC_USERNAME:}
      password: ${TRAINMARK_COURSE_JDBC_PASSWORD:}
management:
  endpoints:
    web:
      exposure:
        include: health,info
