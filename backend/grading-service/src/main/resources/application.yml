server:
  port: 8085
spring:
  application:
    name: grading-service
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
management:
  endpoints:
    web:
      exposure:
        include: health,info

trainmark:
  grading:
    async-enabled: ${GRADING_ASYNC_ENABLED:false}
    export-async-enabled: ${GRADE_EXPORT_ASYNC_ENABLED:false}
    rubric-store: ${TRAINMARK_GRADING_RUBRIC_STORE:memory}
    export-store: ${TRAINMARK_GRADING_EXPORT_STORE:memory}
    publication-audit-store: ${TRAINMARK_GRADING_PUBLICATION_AUDIT_STORE:memory}
    appeal-store: ${TRAINMARK_GRADING_APPEAL_STORE:memory}
    job-store: ${TRAINMARK_GRADING_JOB_STORE:memory}
    result-store: ${TRAINMARK_GRADING_RESULT_STORE:memory}
    queue:
      name: ${GRADING_QUEUE_NAME:trainmark-grading-jobs}
    exchange:
      name: ${GRADING_EXCHANGE_NAME:trainmark-grading-exchange}
    export-queue:
      name: ${GRADE_EXPORT_QUEUE_NAME:trainmark-grade-export-jobs}
    export-exchange:
      name: ${GRADE_EXPORT_EXCHANGE_NAME:trainmark-grade-export-exchange}
    export-routing-key: ${GRADE_EXPORT_ROUTING_KEY:grade.export.create}
    jdbc:
      url: ${TRAINMARK_GRADING_JDBC_URL:}
      username: ${TRAINMARK_GRADING_JDBC_USERNAME:}
      password: ${TRAINMARK_GRADING_JDBC_PASSWORD:}
  scoring:
    provider: ${SCORING_PROVIDER:local}
    command: ${SCORING_COMMAND:}
    endpoint: ${SCORING_ENDPOINT:}
    api-key: ${SCORING_API_KEY:}
    require-real: ${SCORING_REQUIRE_REAL:false}
    timeout-seconds: ${SCORING_TIMEOUT_SECONDS:90}
  annotation:
    provider: ${ANNOTATION_PROVIDER:local}
    command: ${ANNOTATION_COMMAND:}
    output-dir: ${ANNOTATION_OUTPUT_DIR:/tmp/trainmark-annotations}
    timeout-seconds: ${ANNOTATION_TIMEOUT_SECONDS:60}
