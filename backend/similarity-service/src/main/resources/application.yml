server:
  port: 8087
spring:
  application:
    name: similarity-service
management:
  endpoints:
    web:
      exposure:
        include: health,info
trainmark:
  similarity:
    store: ${TRAINMARK_SIMILARITY_STORE:memory}
    jdbc:
      url: ${TRAINMARK_SIMILARITY_JDBC_URL:}
      username: ${TRAINMARK_SIMILARITY_JDBC_USERNAME:}
      password: ${TRAINMARK_SIMILARITY_JDBC_PASSWORD:}
