server:
  port: 8081
spring:
  application:
    name: auth-service
management:
  endpoints:
    web:
      exposure:
        include: health,info
trainmark:
  auth:
    store: ${TRAINMARK_AUTH_STORE:memory}
    jwt-secret: ${AUTH_JWT_SECRET:}
    access-token-ttl-seconds: ${AUTH_ACCESS_TOKEN_TTL:3600}
    refresh-token-ttl-seconds: ${AUTH_REFRESH_TOKEN_TTL:86400}
    jdbc:
      url: ${TRAINMARK_AUTH_JDBC_URL:}
      username: ${TRAINMARK_AUTH_JDBC_USERNAME:}
      password: ${TRAINMARK_AUTH_JDBC_PASSWORD:}
