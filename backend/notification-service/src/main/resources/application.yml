server:
  port: 8089
spring:
  application:
    name: notification-service
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
trainmark:
  notification:
    store: ${TRAINMARK_NOTIFICATION_STORE:memory}
    email-enabled: ${NOTIFICATION_EMAIL_ENABLED:false}
    from-email: ${NOTIFICATION_FROM_EMAIL:}
    jdbc:
      url: ${TRAINMARK_NOTIFICATION_JDBC_URL:}
      username: ${TRAINMARK_NOTIFICATION_JDBC_USERNAME:}
      password: ${TRAINMARK_NOTIFICATION_JDBC_PASSWORD:}
management:
  endpoints:
    web:
      exposure:
        include: health,info
