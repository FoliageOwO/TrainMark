server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins:
              - http://localhost:5173
              - http://localhost:5174
              - http://127.0.0.1:5173
              - http://127.0.0.1:5174
            allowed-methods:
              - GET
              - POST
              - PATCH
              - PUT
              - DELETE
              - OPTIONS
            allowed-headers: "*"
            allow-credentials: true
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**
        - id: course-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/courses/**,/api/assignments/**
        - id: user-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/organizations/**,/api/users/**
        - id: file-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/uploads/**,/api/submissions/**
        - id: grading-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/rubrics/**,/api/grading/**,/annotations/**,/exports/**
        - id: ocr-service
          uri: http://localhost:8086
          predicates:
            - Path=/api/ocr/**
        - id: similarity-service
          uri: http://localhost:8087
          predicates:
            - Path=/api/similarity/**
        - id: notification-service
          uri: http://localhost:8089
          predicates:
            - Path=/api/notifications/**
        - id: analytics-service
          uri: http://localhost:8091
          predicates:
            - Path=/api/analytics/**
        - id: admin-service
          uri: http://localhost:8090
          predicates:
            - Path=/api/admin/**

trainmark:
  auth-service:
    url: ${TRAINMARK_AUTH_SERVICE_URL:http://localhost:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info
