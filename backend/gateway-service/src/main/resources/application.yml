server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**
        - id: course-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/courses/**,/api/assignments/**
        - id: user-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/organizations/**,/api/users/**
        - id: file-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/uploads/**,/api/submissions/**
        - id: grading-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/rubrics/**,/api/grading/**
        - id: ocr-service
          uri: http://localhost:8086
          predicates:
            - Path=/api/ocr/**
        - id: similarity-service
          uri: http://localhost:8087
          predicates:
            - Path=/api/similarity/**
        - id: notification-service
          uri: http://localhost:8089
          predicates:
            - Path=/api/notifications/**
        - id: analytics-service
          uri: http://localhost:8091
          predicates:
            - Path=/api/analytics/**

management:
  endpoints:
    web:
      exposure:
        include: health,info
