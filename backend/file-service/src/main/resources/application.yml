server:
  port: 8084
spring:
  application:
    name: file-service
management:
  endpoints:
    web:
      exposure:
        include: health,info

trainmark:
  upload:
    max-file-size-mb: ${UPLOAD_MAX_FILE_SIZE_MB:50}
    allowed-content-types: ${UPLOAD_ALLOWED_CONTENT_TYPES:application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,image/png,image/jpeg}
