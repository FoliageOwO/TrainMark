server:
  port: 8084
spring:
  application:
    name: file-service
management:
  endpoints:
    web:
      exposure:
        include: health,info

trainmark:
  notification:
    base-url: ${TRAINMARK_NOTIFICATION_BASE_URL:http://localhost:8089}
    event-enabled: ${TRAINMARK_NOTIFICATION_EVENT_ENABLED:true}
  file:
    store: ${TRAINMARK_FILE_STORE:memory}
    jdbc:
      url: ${TRAINMARK_FILE_JDBC_URL:}
      username: ${TRAINMARK_FILE_JDBC_USERNAME:}
      password: ${TRAINMARK_FILE_JDBC_PASSWORD:}
  upload:
    max-file-size-mb: ${UPLOAD_MAX_FILE_SIZE_MB:50}
    allowed-content-types: ${UPLOAD_ALLOWED_CONTENT_TYPES:application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,image/png,image/jpeg}
    object-root: ${UPLOAD_OBJECT_ROOT:.data/uploads}
    require-object-content: ${UPLOAD_REQUIRE_OBJECT_CONTENT:false}
    object-store: ${UPLOAD_OBJECT_STORE:local}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:trainmark}
    secret-key: ${MINIO_SECRET_KEY:trainmark_dev_password}
    bucket: ${MINIO_BUCKET:trainmark-reports}
    secure: ${MINIO_SECURE:false}
