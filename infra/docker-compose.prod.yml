services:
  postgres:
    image: postgres:16-alpine
    container_name: trainmark-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trainmark_ai}
      POSTGRES_USER: ${POSTGRES_USER:-trainmark}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trainmark_dev}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ../backend/db/migration:/docker-entrypoint-initdb.d/migration:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-trainmark} -d $${POSTGRES_DB:-trainmark_ai}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - trainmark-network
  redis:
    image: redis:7-alpine
    container_name: trainmark-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - trainmark-network
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: trainmark-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-trainmark}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-trainmark_dev}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    restart: unless-stopped
    networks:
      - trainmark-network
  minio:
    image: minio/minio:latest
    container_name: trainmark-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-trainmark}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-trainmark_dev_password}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped
    networks:
      - trainmark-network
  backend:
    build:
      context: ..
      dockerfile: infra/Dockerfile.backend
    image: trainmark-backend:latest
    container_name: trainmark-backend
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - TRAINMARK_AUTH_STORE=jdbc
      - TRAINMARK_AUTH_JDBC_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-trainmark_ai}
      - TRAINMARK_AUTH_JDBC_USERNAME=${POSTGRES_USER:-trainmark}
      - TRAINMARK_AUTH_JDBC_PASSWORD=${POSTGRES_PASSWORD:-trainmark_dev}
      - TRAINMARK_USER_STORE=jdbc
      - TRAINMARK_USER_JDBC_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-trainmark_ai}
      - TRAINMARK_USER_JDBC_USERNAME=${POSTGRES_USER:-trainmark}
      - TRAINMARK_USER_JDBC_PASSWORD=${POSTGRES_PASSWORD:-trainmark_dev}
      - TRAINMARK_COURSE_STORE=jdbc
      - TRAINMARK_COURSE_JDBC_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-trainmark_ai}
      - TRAINMARK_COURSE_JDBC_USERNAME=${POSTGRES_USER:-trainmark}
      - TRAINMARK_COURSE_JDBC_PASSWORD=${POSTGRES_PASSWORD:-trainmark_dev}
      - TRAINMARK_FILE_STORE=jdbc
      - TRAINMARK_FILE_JDBC_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-trainmark_ai}
      - TRAINMARK_FILE_JDBC_USERNAME=${POSTGRES_USER:-trainmark}
      - TRAINMARK_FILE_JDBC_PASSWORD=${POSTGRES_PASSWORD:-trainmark_dev}
      - TRAINMARK_OCR_STORE=jdbc
      - TRAINMARK_OCR_JDBC_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-trainmark_ai}
      - TRAINMARK_OCR_JDBC_USERNAME=${POSTGRES_USER:-trainmark}
      - TRAINMARK_OCR_JDBC_PASSWORD=${POSTGRES_PASSWORD:-trainmark_dev}
      - TRAINMARK_GRADING_RUBRIC_STORE=jdbc
      - TRAINMARK_GRADING_EXPORT_STORE=jdbc
      - TRAINMARK_GRADING_PUBLICATION_AUDIT_STORE=jdbc
      - TRAINMARK_GRADING_APPEAL_STORE=jdbc
      - TRAINMARK_GRADING_JOB_STORE=jdbc
      - TRAINMARK_GRADING_RESULT_STORE=jdbc
      - TRAINMARK_GRADING_JDBC_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-trainmark_ai}
      - TRAINMARK_GRADING_JDBC_USERNAME=${POSTGRES_USER:-trainmark}
      - TRAINMARK_GRADING_JDBC_PASSWORD=${POSTGRES_PASSWORD:-trainmark_dev}
      - TRAINMARK_NOTIFICATION_STORE=jdbc
      - TRAINMARK_NOTIFICATION_JDBC_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-trainmark_ai}
      - TRAINMARK_NOTIFICATION_JDBC_USERNAME=${POSTGRES_USER:-trainmark}
      - TRAINMARK_NOTIFICATION_JDBC_PASSWORD=${POSTGRES_PASSWORD:-trainmark_dev}
      - TRAINMARK_SIMILARITY_STORE=jdbc
      - TRAINMARK_SIMILARITY_JDBC_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-trainmark_ai}
      - TRAINMARK_SIMILARITY_JDBC_USERNAME=${POSTGRES_USER:-trainmark}
      - TRAINMARK_SIMILARITY_JDBC_PASSWORD=${POSTGRES_PASSWORD:-trainmark_dev}
      - TRAINMARK_ANALYTICS_STORE=jdbc
      - TRAINMARK_ANALYTICS_JDBC_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-trainmark_ai}
      - TRAINMARK_ANALYTICS_JDBC_USERNAME=${POSTGRES_USER:-trainmark}
      - TRAINMARK_ANALYTICS_JDBC_PASSWORD=${POSTGRES_PASSWORD:-trainmark_dev}
      - TRAINMARK_ADMIN_STORE=jdbc
      - TRAINMARK_ADMIN_JDBC_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-trainmark_ai}
      - TRAINMARK_ADMIN_JDBC_USERNAME=${POSTGRES_USER:-trainmark}
      - TRAINMARK_ADMIN_JDBC_PASSWORD=${POSTGRES_PASSWORD:-trainmark_dev}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=${RABBITMQ_USERNAME:-trainmark}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-trainmark_dev}
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-trainmark}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-trainmark_dev_password}
      - MINIO_BUCKET=trainmark-reports
      - OCR_PROVIDER=${OCR_PROVIDER:-local}
      - OCR_ENDPOINT=${OCR_ENDPOINT:-}
      - OCR_API_KEY=${OCR_API_KEY:-}
      - OCR_REQUIRE_REAL=${OCR_REQUIRE_REAL:-false}
      - OCR_TIMEOUT_SECONDS=${OCR_TIMEOUT_SECONDS:-60}
      - SCORING_PROVIDER=${SCORING_PROVIDER:-local}
      - SCORING_ENDPOINT=${SCORING_ENDPOINT:-}
      - SCORING_API_KEY=${SCORING_API_KEY:-}
      - SCORING_REQUIRE_REAL=${SCORING_REQUIRE_REAL:-false}
      - SCORING_TIMEOUT_SECONDS=${SCORING_TIMEOUT_SECONDS:-90}
    ports:
      - "127.0.0.1:30080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - trainmark-network
  frontend:
    build:
      context: ..
      dockerfile: infra/Dockerfile.frontend
    image: trainmark-frontend:latest
    container_name: trainmark-frontend
    ports:
      - "127.0.0.1:30081:3000"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - trainmark-network
volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  minio-data:
networks:
  trainmark-network:
    driver: bridge
